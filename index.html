<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mark Chern — learning to tell stories with a camera. My latest videos: travel, podcasts and science journalism. Based in Singapore." />
  <title>Mark Chern</title>

  <!-- VERCEL WEB ANALYTICS — visitor stats in the Vercel dashboard -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- GOOGLE FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- QRCODE.JS — used on the QR page only -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ============================================================
       PAGE 1 — LATEST (blog-style feed)
       ============================================================ -->
  <div id="page1" class="page active">

    <!-- HERO -->
    <section id="hero">
      <div class="container">
        <div class="hero-inner animate">
          <div class="profile-photo">
            <img src="images/profile.png" alt="Mark Chern profile photo" width="120" height="120" />
          </div>
          <h1 class="hero-name">Mark Chern</h1>
          <p class="hero-title">Video Maker &middot; Storyteller in Training</p>
          <p class="hero-tagline">Learning to tell stories with a camera.</p>
          <nav class="site-nav" aria-label="Site">
            <a href="/" aria-current="page">Latest</a>
            <a href="portfolio.html">Portfolio</a>
          </nav>
          <button
            class="btn btn-ghost hero-share"
            onclick="showPage('page2')"
            aria-label="Show QR code to share this page"
          >
            Share this page (QR)
          </button>
        </div>
      </div>
    </section>
    <!-- /HERO -->

    <!-- LATEST FEED — rendered from the POSTS list in the script below -->
    <section id="latest">
      <div class="container animate" style="animation-delay: 150ms;">
        <h2 class="section-heading">Latest</h2>
        <div class="feed" id="feed"></div>
        <noscript>
          <p class="post-meta">Turn on JavaScript to see the videos, or visit
            <a href="https://www.youtube.com/@alexandmarksingapore">Alex &amp; Mark</a> and
            <a href="https://www.youtube.com/@midlifebrainproject">Midlife Brain Project</a> on YouTube.</p>
        </noscript>
      </div>
    </section>
    <!-- /LATEST FEED -->

    <!-- FOOTER -->
    <footer style="padding: 32px 0 24px; text-align: center;">
      <button
        class="footer-link"
        onclick="showPage('page2')"
        aria-label="View QR code and social links"
      >
        QR &amp; Links
      </button>
    </footer>
    <!-- /FOOTER -->

  </div>
  <!-- /PAGE 1 -->


  <!-- ============================================================
       PAGE 2 — SOCIAL QR PAGE
       ============================================================ -->
  <div id="page2" class="page">

    <div class="p2-back-bar">
      <button class="btn-back" onclick="showPage('page1')" aria-label="Back to latest videos">
        ← Back
      </button>
    </div>

    <div class="p2-centre">
      <h2 class="p2-name">Mark Chern</h2>
      <p class="p2-subtitle">Video Maker &middot; Storyteller in Training</p>

      <div class="qr-wrapper">
        <div id="qrcode"></div>
      </div>
      <p class="qr-caption">Scan to see my videos</p>

      <p class="p2-touch-heading">Get in Touch</p>
      <div class="p2-buttons">
        <a
          class="btn btn-linkedin btn-full"
          href="https://www.linkedin.com/in/dr-mark-chern"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Connect with Mark Chern on LinkedIn — opens in new tab"
        >
          <svg class="li-icon" viewBox="0 0 24 24" fill="#0A66C2" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
          </svg>
          Connect on LinkedIn
        </a>
      </div>
    </div>

    <div class="p2-footer">
      More contact options coming soon.
    </div>

  </div>
  <!-- /PAGE 2 -->


  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    // ----------------------------------------------------------------
    // POSTS — newest first. To add a video, paste a new line at the TOP.
    // Only the latest 20 are shown.
    //   id:      the YouTube video ID (the part after v= or youtu.be/)
    //   date:    'YYYY-MM-DD'
    //   thumb:   optional custom thumbnail (e.g. 'images/x.jpg');
    //            leave out to use YouTube's own thumbnail
    //   note:    optional one-line caption
    // ----------------------------------------------------------------
    var POSTS = [
      { id: '2KjQJADTw5c', date: '2026-11-26', channel: 'Alex & Mark',
        title: "Are We Stupid to Visit Japan's Most Active Volcano? (Sakurajima 2026)" },
      { id: '81hw7FfV2xc', date: '2026-11-11', channel: 'Midlife Brain Project',
        title: 'Ikigai Is Not What You Think (Finding Purpose After Retirement)' },
      { id: 'PHTKDT9FQ9U', date: '2026-11-04', channel: 'Midlife Brain Project',
        title: 'Aging Without Children in Singapore: Who Will Take Care of Us?',
        thumb: 'images/childless-millennials.jpg' },
      { id: 'jE3r3IwtatA', date: '2026-10-31', channel: 'Midlife Brain Project',
        title: 'Menopause Brain Fog: Is It Permanent, or Early Dementia?' }
    ];

    var MAX_POSTS = 20;

    // ----------------------------------------------------------------
    // FEED RENDERING
    // ----------------------------------------------------------------
    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatDate(iso) {
      var d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-SG', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderFeed() {
      var feed = document.getElementById('feed');
      var html = '';
      POSTS.slice(0, MAX_POSTS).forEach(function(post, i) {
        var thumb = post.thumb || ('https://i.ytimg.com/vi/' + post.id + '/maxresdefault.jpg');
        var title = escapeHtml(post.title);
        html +=
          '<article class="post">' +
            '<div class="player">' +
              '<button class="poster" data-video-id="' + post.id + '" onclick="playVideo(this)" aria-label="Play ' + title + '">' +
                '<img src="' + thumb + '" alt="" loading="' + (i === 0 ? 'eager' : 'lazy') + '" />' +
              '</button>' +
            '</div>' +
            '<p class="post-date">' + formatDate(post.date) + (i === 0 ? '<span class="post-new">New</span>' : '') + '</p>' +
            '<p class="post-title">' + title + '</p>' +
            (post.note ? '<p class="post-note">' + escapeHtml(post.note) + '</p>' : '') +
            '<p class="post-meta">' + escapeHtml(post.channel) + ' &middot; ' +
              '<a href="https://www.youtube.com/watch?v=' + post.id + '" target="_blank" rel="noopener noreferrer">Watch on YouTube</a>' +
            '</p>' +
          '</article>';
      });
      feed.innerHTML = html;
    }

    // Swap a thumbnail for the YouTube player when tapped
    function playVideo(btn) {
      var iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/' + btn.dataset.videoId + '?autoplay=1';
      iframe.title = btn.getAttribute('aria-label').replace(/^Play /, '');
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      iframe.allowFullscreen = true;
      btn.replaceWith(iframe);
    }

    // ----------------------------------------------------------------
    // PAGE SWITCHING
    // Hides all pages, shows the target page, triggers fade-in animation.
    // ----------------------------------------------------------------
    function showPage(id) {
      var pages = document.querySelectorAll('.page');

      pages.forEach(function(p) {
        p.classList.remove('active');
        p.style.display = 'none';
        p.style.opacity = '0';
      });

      var target = document.getElementById(id);
      if (!target) return;

      // Page 2 uses flex; page 1 uses block
      target.style.display = (id === 'page2') ? 'flex' : 'block';
      target.classList.add('active');
      target.style.opacity = '1';

      window.scrollTo({ top: 0, behavior: 'instant' });

      if (id === 'page1') {
        triggerStaggeredAnimations();
      }
    }

    // Re-trigger CSS animations when returning to page 1
    function triggerStaggeredAnimations() {
      var elements = document.querySelectorAll('#page1 .animate');
      elements.forEach(function(el) {
        el.style.animation = 'none';
        void el.offsetWidth; // force reflow
        el.style.animation = '';
      });
    }

    // ----------------------------------------------------------------
    // QR CODE GENERATION
    // ----------------------------------------------------------------
    var QR_URL = 'https://markchern.vercel.app';

    document.addEventListener('DOMContentLoaded', function() {

      renderFeed();

      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('qrcode'), {
          text:        QR_URL,
          width:       220,
          height:      220,
          colorDark:   '#1A1A1A',
          colorLight:  '#FFFFFF',
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        document.getElementById('qrcode').innerHTML =
          '<p style="font-size:0.75rem;color:#6B7280;padding:20px;text-align:center;">QR code unavailable offline</p>';
      }

      // portfolio.html links here with #share to open the QR page
      if (location.hash === '#share') {
        showPage('page2');
      } else {
        var page1 = document.getElementById('page1');
        page1.style.display = 'block';
        page1.style.opacity = '1';
      }

    });
  </script>
  <!-- /JAVASCRIPT -->

</body>
</html>
